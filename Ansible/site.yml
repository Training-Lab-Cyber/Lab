---
- hosts: gcp_group_redirector
  gather_facts: false
  vars:
    redirect_ip: "{{ groups['gcp_group_c2'] | map('extract', hostvars, 'inventory_hostname') | list }}"
  roles:
    - apache2

- hosts: gcp_group_c2
  gather_facts: false
  roles:
    - c2

- hosts: gcp_group_proxy
  gather_facts: false
  roles:
    - squid
  vars:
    allowed_ip_group: "gcp_group_pc_dev"

- hosts: gcp_group_ad_dev
  gather_facts: false
  roles:
    - ad
  vars:
    domain: dev.com
    netbios_name: DEV

- hosts: gcp_group_pc_dev
  gather_facts: false
  vars:
    domain: dev.com
    dns_server: "{{ groups['gcp_group_ad_dev'] | map('extract', hostvars, 'inventory_hostname') | list }}"
    proxy_server: "{{ groups['gcp_group_proxy'] | map('extract', hostvars, 'inventory_hostname') | list }}"
    proxy_port: "3128"
  roles:
    - pc

- hosts: gcp_group_server_dev
  gather_facts: false
  vars:
    domain: dev.com
    dns_server: "{{ groups['gcp_group_ad_dev'] | map('extract', hostvars, 'inventory_hostname') | list }}"
    proxy_server: "{{ groups['gcp_group_proxy'] | map('extract', hostvars, 'inventory_hostname') | list }}"
    proxy_port: "3128"
  roles:
    - server

- hosts: gcp_group_ad_prod
  gather_facts: false
  roles:
    - ad
  vars:
    domain: prod.com
    netbios_name: PROD

- hosts: gcp_group_ad_dev
  gather_facts: false
  roles:
    - ad_trust_outbound
  vars:
    target_domain: prod.com
    source_domain: dev.com
    target_dns_ip: "{{ groups['gcp_group_ad_prod'] | map('extract', hostvars, 'inventory_hostname') | list }}"
