---
- hosts: gcp_group_redirector
  gather_facts: false
  roles:
    - apache2
    - squid
  vars:
    allowed_ip_group: "gcp_group_c2"

- hosts: gcp_group_c2
  gather_facts: false
  roles:
    - sliver
  vars:
    proxy_server: "{{ groups['gcp_group_redirector'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    proxy_port: "3128"

- hosts: gcp_group_redirector
  gather_facts: false
  roles:
    - ssh_tunneling_dest

- hosts: gcp_group_c2
  gather_facts: false
  vars:
    target_ip: "{{ groups['gcp_group_c2'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    remote_ports:
      - src_port: 8080
        dest_host: localhost
        dest_port: 8080
      - src_port: 31337
        dest_host: localhost
        dest_port: 31337
    proxy_server: "{{ groups['gcp_group_redirector'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    proxy_port: "3128"
  roles:
    - ssh_tunneling_src

- hosts: gcp_group_proxy
  gather_facts: false
  roles:
    - squid
  vars:
    allowed_ip_group: "gcp_group_pc_dev"

- hosts: gcp_group_ad_dev
  gather_facts: false
  roles:
    - ad
  vars:
    domain: dev.com
    netbios_name: DEV

- hosts: gcp_group_pc_dev
  gather_facts: false
  vars:
    domain: dev.com
    dns_server: "{{ groups['gcp_group_ad_dev'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    proxy_server: "{{ groups['gcp_group_proxy'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    proxy_port: "3128"
  roles:
    - pc

- hosts: gcp_group_server_dev
  gather_facts: false
  vars:
    domain: dev.com
    dns_server: "{{ groups['gcp_group_ad_dev'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    proxy_server: "{{ groups['gcp_group_proxy'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    proxy_port: "3128"
  roles:
    - server

- hosts: gcp_group_ad_prod
  gather_facts: false
  roles:
    - ad
  vars:
    domain: prod.com
    netbios_name: PROD

- hosts: gcp_group_ad_dev
  gather_facts: false
  roles:
    - ad_trust
  vars:
    target_domain: prod.com
    target_dns_ip: "{{ groups['gcp_group_ad_prod'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    direction: OutBound
    trust_password: "TrustPassword123!"

- hosts: gcp_group_ad_prod
  gather_facts: false
  roles:
    - ad_trust
  vars:
    target_domain: dev.com
    target_dns_ip: "{{ groups['gcp_group_ad_dev'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    direction: InBound
    trust_password: "TrustPassword123!"

- hosts: gcp_group_ad_dev
  gather_facts: false
  roles:
    - ad_unconstrained_delegation
  vars:
    target_hostname: "{{ groups['gcp_group_server_dev'] | map('extract', hostvars, 'name') | first }}"
