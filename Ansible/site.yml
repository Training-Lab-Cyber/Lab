---
###
# Create Redirector and C2 infra
###
- hosts: gcp_group_phishing
  gather_facts: false
  roles:
    - roles/linux/web

- hosts: gcp_group_redirector
  gather_facts: false
  roles:
    - roles/linux/redirector
    - roles/linux/proxy
  vars:
    allowed_ip_group: "gcp_group_c2"

- hosts: gcp_group_c2
  gather_facts: false
  roles:
    - roles/linux/c2/havoc
  vars:
    proxy_server: "{{ groups['gcp_group_redirector'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    proxy_port: "3128"

- hosts: gcp_group_redirector
  gather_facts: false
  roles:
    - roles/linux/ssh_tunneling/dest

- hosts: gcp_group_c2
  gather_facts: false
  vars:
    target_ip: "{{ groups['gcp_group_redirector'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    remote_ports:
      - src_port: 8080
        dest_host: localhost
        dest_port: 8080
      - src_port: 40056
        dest_host: localhost
        dest_port: 40056
      - src_port: 1080
        dest_host: localhost
        dest_port: 1080
    proxy_server: "{{ groups['gcp_group_redirector'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    proxy_port: "3128"
  roles:
    - roles/linux/ssh_tunneling/src

###
# Create Test environment
###

- hosts: gcp_group_proxy
  gather_facts: false
  roles:
    - roles/linux/proxy
  vars:
    allowed_ip_group: "gcp_group_terminal_dev"

- hosts: gcp_group_ad_dev
  gather_facts: false
  roles:
    - roles/windows/active_directory/domain_controller
  vars:
    domain: dev.com
    netbios_name: DEV

- hosts: gcp_group_ad_prod
  gather_facts: false
  roles:
    - roles/windows/active_directory/domain_controller
  vars:
    domain: prod.com
    netbios_name: PROD

- hosts: gcp_group_ad_dev
  gather_facts: false
  roles:
    - roles/windows/active_directory/trust_relationship
  vars:
    target_domain: prod.com
    target_dns_ip: "{{ groups['gcp_group_ad_prod'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    direction: OutBound
    trust_password: "TrustPassword123!"

- hosts: gcp_group_ad_prod
  gather_facts: false
  roles:
    - roles/windows/active_directory/trust_relationship
  vars:
    target_domain: dev.com
    target_dns_ip: "{{ groups['gcp_group_ad_dev'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    direction: InBound
    trust_password: "TrustPassword123!"

- hosts: gcp_group_terminal_dev
  gather_facts: false
  vars:
    domain: dev.com
    dns_server: "{{ groups['gcp_group_ad_dev'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    proxy_server: "{{ groups['gcp_group_proxy'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    proxy_port: "3128"
  roles:
    - roles/windows/terminals

- hosts: gcp_group_server_dev
  gather_facts: false
  vars:
    domain: dev.com
    dns_server: "{{ groups['gcp_group_ad_dev'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    proxy_server: "{{ groups['gcp_group_proxy'] | map('extract', hostvars, 'inventory_hostname') | first }}"
    proxy_port: "3128"
  roles:
    - roles/windows/servers

###
# configure vulnerability to test attack techniques
###

- hosts: gcp_group_ad_dev
  gather_facts: false
  roles:
    - roles/windows/vuln_config/unconstrained_delegation
  vars:
    target_hostname: "{{ groups['gcp_group_server_dev'] | map('extract', hostvars, 'name') | first }}"

###
# Install EDR to test servers
###

- hosts: gcp_group_elk
  gather_facts: false
  roles:
    - roles/linux/web
    - roles/linux/elk

- hosts: gcp_group_ad_dev, gcp_group_terminal_dev,gcp_group_server_dev, gcp_group_ad_prod
  gather_facts: false
  roles:
    - roles/windows/elastic_agent
  vars:
    fleet-server: "{{ groups['gcp_group_elk'] | map('extract', hostvars, 'name') | first }}"
    file: windows.ps1

- hosts: gcp_group_proxy
  gather_facts: false
  roles:
    - roles/linux/elastic_agent
  vars:
    fleet-server: "{{ groups['gcp_group_elk'] | map('extract', hostvars, 'name') | first }}"
    file: proxy.sh
