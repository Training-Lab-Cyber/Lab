---
- name: Ensure user 'tunneling' exists
  user:
    name: tunneling
    state: present
    shell: /bin/bash
  become: true

- name: Create .ssh directory for user 'tunneling'
  file:
    path: /home/tunneling/.ssh
    state: directory
    owner: tunneling
    group: tunneling
    mode: "0700"
  become: true

- name: Set the public key for user 'tunneling'
  copy:
    src: files/authorized_keys
    dest: /home/tunneling/.ssh/authorized_keys
    owner: tunneling
    group: tunneling
    mode: "0600"
  become: true

- name: Update GatewayPorts setting in sshd_config
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?GatewayPorts"
    line: "GatewayPorts yes"
    state: present
  become: true

- name: Restart SSH
  service:
    name: sshd
    state: restarted
  become: true
