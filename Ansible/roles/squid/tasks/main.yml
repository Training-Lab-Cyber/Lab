---
- name: Install Squid
  ansible.builtin.apt:
    name: squid
    state: present
    update_cache: yes 
  become: yes
  
- name: Deploy custom squid.conf
  ansible.builtin.template:
    src: templates/squid.conf.j2  
    dest: /etc/squid/squid.conf  
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Restart Squid service
  ansible.builtin.service:
    name: squid
    state: restarted
  become: yes

- name: Enable Squid to start on boot
  ansible.builtin.systemd:
    name: squid
    enabled: yes
  become: yes