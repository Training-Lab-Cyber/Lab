---
- name: Install the Active Directory Domain Services feature
  ansible.builtin.win_feature:
    name: AD-Domain-Services
    state: present

- name: Set a strong password for the local Administrator account
  ansible.builtin.win_command: |
    net user Administrator "StrongPassword123!"

- name: Configure Active Directory
  ansible.builtin.win_shell: |
    Import-Module ADDSDeployment
    Install-ADDSForest `
      -DomainName "{{ domain }}" `
      -DomainNetbiosName "{{ domain.split('.')[0] | upper }}" `
      -InstallDNS `
      -NoRebootOnCompletion `
      -SafeModeAdministratorPassword (ConvertTo-SecureString "your_safemode_password" -AsPlainText -Force) `
      -Force

- name: Reboot the server to complete AD installation
  ansible.builtin.win_reboot:
    reboot_timeout: 600
