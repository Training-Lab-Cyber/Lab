---
- name: Install Apache and AutoSSH
  apt:
    name: apache2
    state: present
  become: true

- name: Start Apache service
  service:
    name: apache2
    state: started
    enabled: yes
  become: true

- name: Configure Apache to redirect to the specified IP on port 8080
  template:
    src: apache.conf.j2
    dest: /etc/apache2/sites-available/000-default.conf
  become: true

- name: Enable the new site configuration
  command: /usr/sbin/a2ensite 000-default
  become: true

- name: Enable mod_proxy
  command: /usr/sbin/a2enmod proxy
  become: true

- name: Enable mod_proxy_http
  command: /usr/sbin/a2enmod proxy_http
  become: true

- name: Start and enable Apache service
  service:
    name: apache2
    state: restarted
  become: true

- name: Start and enable Apache service
  service:
    name: apache2
    state: started
    enabled: yes
  become: true

- name: Ensure user 'tunneling' exists
  user:
    name: tunneling
    state: present
    shell: /bin/bash
  become: true

- name: Create .ssh directory for user 'tunneling'
  file:
    path: /home/tunneling/.ssh
    state: directory
    owner: tunneling
    group: tunneling
    mode: "0700"
  become_user: tunneling

- name: Set the public key for user 'tunneling'
  copy:
    src: files/authorized_keys
    dest: /home/tunneling/.ssh/authorized_keys
    owner: tunneling
    group: tunneling
    mode: "0600"
  become_user: tunneling
