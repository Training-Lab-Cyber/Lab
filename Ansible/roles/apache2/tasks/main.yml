---
- name: Install Apache
  apt:
    name: apache2
    state: present

- name: Start Apache service
  service:
    name: apache2
    state: started
    enabled: yes

- name: Configure Apache to redirect to the specified IP on port 8080
  template:
    src: apache_redirect.conf.j2
    dest: /etc/apache2/sites-available/000-default.conf

- name: Enable the new site configuration
  command: a2ensite 000-default
  notify: restart apache

- name: Start and enable Apache service
  service:
    name: apache2
    state: started
    enabled: yes
