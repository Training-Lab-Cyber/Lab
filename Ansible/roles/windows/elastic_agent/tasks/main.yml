---
- name: Download the installation script
  get_url:
    url: "http://{{ fleet-server }}/{{ file }}"
    dest: C:\\Users\\Ansible\\{{ file }}
  become: true

- name: Execute the installation script on Windows
  win_shell: |
    powershell.exe -ExecutionPolicy Bypass -File C:\\Users\\Ansible\\{{ file }}
  become: true
