---
- name: Set Unconstrained Delegation using DnsHostName
  ansible.windows.win_shell: |
    $ComputerName = "{{ target_hostname }}"
    $Computer = Get-ADComputer -Identity $ComputerName
    if ($Computer -ne $null) {
        Set-ADComputer -Identity $ComputerName -TrustedForDelegation $true
    } else {
        Write-Error "Computer object $ComputerName not found in AD."
    }
  args:
    executable: PowerShell
