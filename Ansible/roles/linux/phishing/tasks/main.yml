---
- name: Install Apache
  apt:
    name: apache2
    state: present
  become: true

- name: Start Apache service
  service:
    name: apache2
    state: started
    enabled: yes
  become: true

- name: Copy index.html to the web server document root
  ansible.builtin.copy:
    src: roles/apache/files/index.html
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: "0644"
  become: true

- name: Start and enable Apache service
  service:
    name: apache2
    state: restarted
  become: true
