---
- name: Update APT package index
  apt:
    update_cache: yes
  become: true

- name: Install ca-certificates and curl
  apt:
    name:
      - ca-certificates
      - curl
    state: present
  become: true

- name: Create directory for apt keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Download Docker GPG key
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true

- name: Add Docker repository to Apt sources
  shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo \"$VERSION_CODENAME\") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  become: true

- name: Update APT package index again
  apt:
    update_cache: yes
  become: true

- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  become: true

- name: Clone the docker-elk repository
  git:
    repo: https://github.com/deviantony/docker-elk.git
    dest: /opt/docker-elk
  become: true


- name: Start Docker Compose services
  command: docker compose up setup
  args:
    chdir: /opt/docker-elk
  become: true

- name: Display Docker Compose services status
  command: docker compose -f docker-compose.yml -f extensions/fleet/fleet-compose.yml up -d
  args:
    chdir: /opt/docker-elk
  become: true

- name: Copy 'file' directory recursively to the target machine
  ansible.builtin.copy:
    src: AgentPolicies
    dest: "/tmp/AgentPolicies"
    mode: '0755'
    remote_src: no

- name: Ensure Python 3 is installed on the target machine
  ansible.builtin.apt:
    name: python3
    state: present
  become: true

- name: Run the Python script in the copied directory
  ansible.builtin.command:
    cmd: >
      python3 /tmp/AgentPolicies/createPolicy.py --path /tmp/AgentPolicies/windows
      python3 /tmp/AgentPolicies/createPolicy.py --path /tmp/AgentPolicies/proxy
  environment:
    KIBANA_URL: "http://localhost:5601"
    KIBANA_USERNAME: "elastic" 
    KIBANA_PASSWORD: "changeme"