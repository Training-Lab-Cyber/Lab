---
- name: Install Apache
  apt:
    name: apache2
    state: present
  become: true

- name: Start Apache service
  service:
    name: apache2
    state: started
    enabled: yes
  become: true

- name: Configure Apache to redirect to the specified IP on port 8080
  template:
    src: apache.conf.j2
    dest: /etc/apache2/sites-available/000-default.conf
  become: true

- name: Enable the new site configuration
  command: /usr/sbin/a2ensite 000-default
  become: true

- name: Enable rewrite
  command: /usr/sbin/a2enmod rewrite
  become: true

- name: Enable mod_proxy
  command: /usr/sbin/a2enmod proxy_http
  become: true

- name: Enable mod_proxy
  command: /usr/sbin/a2enmod rewrite
  become: true

- name: Start and enable Apache service
  service:
    name: apache2
    state: restarted
  become: true

- name: Start and enable Apache service
  service:
    name: apache2
    state: started
    enabled: yes
  become: true
